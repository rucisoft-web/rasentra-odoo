; Rasentra Central (kantor pusat). Database: rasentra_central.
[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/rasentra/addons,/mnt/rasentra/oca/queue,/mnt/rasentra/oca/rest-framework,/mnt/rasentra/oca/web-api,/mnt/rasentra/oca/server-tools
data_dir = /var/lib/odoo
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = rasentra_central
dbfilter = ^rasentra_central$
list_db = False
proxy_mode = True
without_demo = all
server_wide_modules = base,web,queue_job
workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240

[queue_job]
channels = root:2

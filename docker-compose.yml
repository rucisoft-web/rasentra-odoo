# Lingkungan pengembangan: satu PostgreSQL 16 dengan dua instalasi Odoo 18 Community.
#   docker compose --profile central up        # Rasentra Central di http://localhost:8069
#   docker compose --profile lokal up          # Rasentra Lokal di http://localhost:8070
#   docker compose --profile central --profile lokal up
# Kode di addons/ dan oca/ dipasang sebagai volume, jadi cukup restart service setelah mengubah Python.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      retries: 10

  central:
    profiles: ["central"]
    build: .
    command: ["odoo", "-c", "/etc/odoo/rasentra/odoo-central.conf"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/rasentra/addons
      - ./oca:/mnt/rasentra/oca
      - ./scripts:/mnt/rasentra/scripts
      - ./config:/etc/odoo/rasentra
      - central-data:/var/lib/odoo

  lokal:
    profiles: ["lokal"]
    build: .
    command: ["odoo", "-c", "/etc/odoo/rasentra/odoo-lokal.conf"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8070:8069"
    volumes:
      - ./addons:/mnt/rasentra/addons
      - ./oca:/mnt/rasentra/oca
      - ./scripts:/mnt/rasentra/scripts
      - ./config:/etc/odoo/rasentra
      - lokal-data:/var/lib/odoo

volumes:
  pgdata:
  central-data:
  lokal-data:
